name: lycee_app
description: "lycard —— Lycee Overture 卡组助手。由镧锕Lanactnum的大肥鱼制作，以 MIT 协议开源。"
publish_to: 'none'
version: 0.85.2+95

environment:
  sdk: ^3.13.0

dependencies:
